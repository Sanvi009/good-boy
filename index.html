<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/good-boy/">
    <title>For Minsuuu</title>
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #fff;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* CSS Heart Icon */
        .heart-icon {
            width: 32px;
            height: 32px;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .heart-icon:hover {
            transform: scale(1.1);
        }

        .heart-icon::before,
        .heart-icon::after {
            content: '';
            position: absolute;
            top: 0;
            width: 16px;
            height: 26px;
            border-radius: 16px 16px 0 0;
            background: linear-gradient(135deg, #ff6b6b, #ff2e63);
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart-icon::before {
            left: 16px;
        }

        .heart-icon::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        /* Brand Text */
        .brand {
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ff6b6b, #ff2e63, #ff6b6b);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 3s ease infinite;
            letter-spacing: 1px;
        }

        @keyframes gradient {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* Content */
        .content {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 20px 40px;
        }

        /* Continue Watching Section */
        .continue-watching {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: #ff2e63;
            border-radius: 4px;
        }

        /* Video List (1 column - YouTube style) */
        .video-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Video Card */
        .video-card {
            display: flex;
            background: transparent;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .video-card:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .video-card:hover .video-title {
            color: #ff6b6b;
        }

        .video-thumb {
            position: relative;
            width: 180px;
            aspect-ratio: 16/9;
            border-radius: 8px;
            overflow: hidden;
            background: #1a1a1a;
            flex-shrink: 0;
            margin: 10px;
        }

        .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .video-card:hover .video-thumb img {
            transform: scale(1.05);
        }

        /* Duration Badge */
        .duration-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Last Watched Icon */
        .last-watched-icon {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #ff2e63;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .last-watched-icon::before {
            content: '▶';
            font-size: 0.6rem;
        }

        .video-info {
            padding: 10px 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .video-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.3s ease;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                padding: 10px 15px;
            }

            .brand {
                font-size: 1.2rem;
            }

            .content {
                padding: 70px 15px 30px;
            }

            .video-thumb {
                width: 140px;
                margin: 8px;
            }

            .video-title {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .video-thumb {
                width: 120px;
                margin: 6px;
            }

            .video-card {
                flex-direction: row;
            }

            .video-title {
                font-size: 0.8rem;
                -webkit-line-clamp: 2;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="heart-icon" onclick="window.location.href='index.html'"></div>
        <span class="brand">just for minsuuu</span>
    </nav>

    <!-- Main Content -->
    <div class="content">
        <!-- Continue Watching Section -->
        <div id="continueSection" class="continue-watching" style="display: none;">
            <div class="section-title">Continue Watching</div>
            <div class="video-list" id="continueList"></div>
        </div>

        <!-- All Episodes Section -->
        <div class="all-episodes">
            <div class="section-title">All Episodes</div>
            <div class="video-list" id="episodeList"></div>
        </div>
    </div>

    <script>
        const TOTAL_EPISODES = 32;
        const episodeList = document.getElementById('episodeList');
        const continueList = document.getElementById('continueList');
        const continueSection = document.getElementById('continueSection');

        // Video durations (in seconds) - you can update these with actual durations
        const durations = {};
        for (let i = 1; i <= TOTAL_EPISODES; i++) {
            durations[i] = 24 * 60 + (i * 37) % 60; // Random 24-25 min durations
        }

        // Format duration to mm:ss or hh:mm:ss
        function formatDuration(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            if (hours > 0) {
                return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }

        // Create video card element
        function createVideoCard(episode, isLastWatched = false) {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.onclick = () => goToEpisode(episode);
            
            card.innerHTML = `
                <div class="video-thumb">
                    <img src="thumbnails/episode-${episode}.jpg" alt="Episode ${episode}" loading="lazy">
                    <div class="duration-badge">${formatDuration(durations[episode])}</div>
                    ${isLastWatched ? '<div class="last-watched-icon">Last watched</div>' : ''}
                </div>
                <div class="video-info">
                    <div class="video-title">Good Boy Hindi Episode ${episode}</div>
                </div>
            `;
            
            return card;
        }

        // Generate episode list (1 column)
        for (let i = 1; i <= TOTAL_EPISODES; i++) {
            const card = createVideoCard(i);
            episodeList.appendChild(card);
        }

        // Check continue watching
        const lastEpisode = localStorage.getItem('lastWatchedEpisode');
        if (lastEpisode && lastEpisode >= 1 && lastEpisode <= TOTAL_EPISODES) {
            continueSection.style.display = 'block';
            const continueCard = createVideoCard(parseInt(lastEpisode), true);
            continueList.appendChild(continueCard);
        }

        function goToEpisode(episode) {
            window.location.href = `player/index.html?ep=${episode}`;
        }
    </script>
</body>
</html>
