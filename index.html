<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/good-boy/">
    <title>For Minsuuu</title>
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #fff;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* CSS Heart Icon */
        .heart-icon {
            width: 32px;
            height: 32px;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .heart-icon:hover {
            transform: scale(1.1);
        }

        .heart-icon::before,
        .heart-icon::after {
            content: '';
            position: absolute;
            top: 0;
            width: 16px;
            height: 26px;
            border-radius: 16px 16px 0 0;
            background: linear-gradient(135deg, #ff6b6b, #ff2e63);
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart-icon::before {
            left: 16px;
        }

        .heart-icon::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        /* Brand Text */
        .brand {
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ff6b6b, #ff2e63, #ff6b6b);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 3s ease infinite;
            letter-spacing: 1px;
        }

        @keyframes gradient {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* Content */
        .content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 80px 20px 40px;
        }

        /* Continue Watching */
        .continue-watching {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: #ff2e63;
            border-radius: 4px;
        }

        /* Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Video Card (YouTube style) */
        .video-card {
            background: transparent;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .video-card:hover {
            transform: translateY(-4px);
        }

        .video-card:hover .video-title {
            color: #ff6b6b;
        }

        .video-thumb {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a1a;
        }

        .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .video-card:hover .video-thumb img {
            transform: scale(1.05);
        }

        .video-info {
            padding: 12px 4px;
        }

        .video-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.3s ease;
        }

        .video-meta {
            font-size: 0.8rem;
            color: #888;
        }

        /* Continue Watching Card */
        .continue-card {
            background: linear-gradient(135deg, rgba(255, 46, 99, 0.1), rgba(255, 107, 107, 0.05));
            border: 1px solid rgba(255, 46, 99, 0.3);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .continue-card:hover {
            border-color: #ff2e63;
            transform: scale(1.01);
            box-shadow: 0 10px 40px rgba(255, 46, 99, 0.15);
        }

        .continue-thumb {
            width: 160px;
            aspect-ratio: 16/9;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .continue-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .continue-info {
            flex-grow: 1;
        }

        .continue-info h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }

        .continue-info p {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 12px;
        }

        .resume-btn {
            background: #ff2e63;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .resume-btn:hover {
            background: #ff6b6b;
            transform: scale(1.05);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                padding: 10px 15px;
            }

            .brand {
                font-size: 1.2rem;
            }

            .content {
                padding: 70px 15px 30px;
            }

            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 15px;
            }

            .continue-card {
                flex-direction: column;
                text-align: center;
            }

            .continue-thumb {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .video-title {
                font-size: 0.85rem;
            }

            .video-meta {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="heart-icon" onclick="window.location.href='index.html'"></div>
        <span class="brand">just for minsuuu</span>
    </nav>

    <!-- Main Content -->
    <div class="content">
        <!-- Continue Watching Section -->
        <div id="continueSection" class="continue-watching" style="display: none;">
            <div class="section-title">Continue Watching</div>
            <div class="continue-card" onclick="goToEpisode(this.dataset.ep)">
                <div class="continue-thumb">
                    <img src="" alt="Episode thumbnail" id="continueThumb">
                </div>
                <div class="continue-info">
                    <h3 id="continueTitle"></h3>
                    <p>Pick up where you left off</p>
                    <button class="resume-btn">▶ Resume</button>
                </div>
            </div>
        </div>

        <!-- All Episodes Section -->
        <div class="all-episodes">
            <div class="section-title">All Episodes</div>
            <div class="video-grid" id="episodeGrid"></div>
        </div>
    </div>

    <script>
        const TOTAL_EPISODES = 32;
        const episodeGrid = document.getElementById('episodeGrid');
        const continueSection = document.getElementById('continueSection');

        // Generate episode cards (YouTube style)
        for (let i = 1; i <= TOTAL_EPISODES; i++) {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.onclick = () => goToEpisode(i);
            
            card.innerHTML = `
                <div class="video-thumb">
                    <img src="thumbnails/episode-${i}.jpg" alt="Episode ${i}" loading="lazy">
                </div>
                <div class="video-info">
                    <div class="video-title">Good Boy Hindi Episode ${i}</div>
                    <div class="video-meta">Episode ${i} of ${TOTAL_EPISODES}</div>
                </div>
            `;
            
            episodeGrid.appendChild(card);
        }

        // Check continue watching
        const lastEpisode = localStorage.getItem('lastWatchedEpisode');
        if (lastEpisode && lastEpisode >= 1 && lastEpisode <= TOTAL_EPISODES) {
            continueSection.style.display = 'block';
            document.getElementById('continueThumb').src = `thumbnails/episode-${lastEpisode}.jpg`;
            document.getElementById('continueTitle').textContent = `Good Boy Hindi Episode ${lastEpisode}`;
            continueSection.querySelector('.continue-card').dataset.ep = lastEpisode;
        }

        function goToEpisode(episode) {
            window.location.href = `player/index.html?ep=${episode}`;
        }
    </script>
</body>
</html>
