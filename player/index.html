<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/good-boy/">
    <title>Player</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            padding-top: 60px;
        }

        /* Navbar - Fixed */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* CSS Heart Icon */
        .heart-icon {
            width: 32px;
            height: 32px;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .heart-icon:hover {
            transform: scale(1.1);
        }

        .heart-icon::before,
        .heart-icon::after {
            content: '';
            position: absolute;
            top: 0;
            width: 16px;
            height: 26px;
            border-radius: 16px 16px 0 0;
            background: linear-gradient(135deg, #ff6b6b, #ff2e63);
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart-icon::before {
            left: 16px;
        }

        .heart-icon::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        /* Brand Text */
        .brand {
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ff6b6b, #ff2e63, #ff6b6b);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 3s ease infinite;
            letter-spacing: 1px;
        }

        @keyframes gradient {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* Main Content */
        .main-content {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Video Wrapper */
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            aspect-ratio: 16/9;
            max-height: 75vh;
            cursor: pointer;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }

        /* Overlay Controls */
        .controls-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.3);
        }

        .video-wrapper.controls-visible .controls-overlay {
            opacity: 1;
            pointer-events: all;
        }

        /* Top controls area */
        .controls-top {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* Back button */
        .back-btn {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: #ff2e63;
        }

        /* Center controls */
        .controls-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        /* Material Icon Buttons */
        .ctrl-btn {
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-btn:hover {
            background: #ff2e63;
            transform: scale(1.1);
        }

        .ctrl-btn:disabled {
            background: rgba(0, 0, 0, 0.3);
            cursor: not-allowed;
            transform: none;
            opacity: 0.5;
        }

        .ctrl-btn .material-icons {
            font-size: 24px;
        }

        /* Main play button - bigger */
        .play-pause-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #fff;
            color: #fff;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .play-pause-btn:hover {
            background: #ff2e63;
            border-color: #ff2e63;
            transform: scale(1.1);
        }

        .play-pause-btn .material-icons {
            font-size: 36px;
        }

        /* Skip buttons */
        .skip-btn {
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .skip-btn:hover {
            background: #ff2e63;
            transform: scale(1.1);
        }

        .skip-btn .material-icons {
            font-size: 28px;
        }

        /* Bottom controls */
        .controls-bottom {
            padding: 15px 20px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: #ff2e63;
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s ease;
        }

        .mini-ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s ease;
        }

        .mini-ctrl-btn:hover {
            color: #ff2e63;
        }

        .mini-ctrl-btn .material-icons {
            font-size: 20px;
        }

        .time-display {
            color: #fff;
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
        }

        /* Loading indicator */
        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #ff2e63;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
            z-index: 5;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Title Section */
        .title-section {
            padding: 20px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .title-section h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            line-height: 1.4;
        }

        /* Related Episodes Section */
        .related-section {
            padding: 20px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: #ff2e63;
            border-radius: 4px;
        }

        /* Video List (1 column) */
        .video-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Video Card */
        .video-card {
            display: flex;
            background: transparent;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .video-card:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .video-card:hover .video-title {
            color: #ff6b6b;
        }

        .video-thumb {
            position: relative;
            width: 180px;
            aspect-ratio: 16/9;
            border-radius: 8px;
            overflow: hidden;
            background: #1a1a1a;
            flex-shrink: 0;
            margin: 10px;
        }

        .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .video-card:hover .video-thumb img {
            transform: scale(1.05);
        }

        .duration-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .video-info {
            padding: 10px 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .video-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.3s ease;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                padding: 10px 15px;
            }

            .brand {
                font-size: 1.2rem;
            }

            .video-wrapper {
                aspect-ratio: 16/9;
                max-height: 60vh;
            }

            .ctrl-btn {
                width: 40px;
                height: 40px;
            }

            .play-pause-btn {
                width: 55px;
                height: 55px;
            }

            .play-pause-btn .material-icons {
                font-size: 28px;
            }

            .skip-btn {
                width: 38px;
                height: 38px;
            }

            .video-thumb {
                width: 140px;
                margin: 8px;
            }

            .video-title {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .video-thumb {
                width: 120px;
                margin: 6px;
            }

            .video-title {
                font-size: 0.8rem;
                -webkit-line-clamp: 2;
            }

            .back-btn {
                padding: 6px 10px;
                font-size: 0.75rem;
            }

            .ctrl-btn {
                width: 35px;
                height: 35px;
            }

            .play-pause-btn {
                width: 45px;
                height: 45px;
            }

            .skip-btn {
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>
<body>
    <!-- Fixed Navbar -->
    <nav class="navbar">
        <div class="heart-icon" onclick="window.location.href='../index.html'"></div>
        <span class="brand">just for minsuuu</span>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Video Player -->
        <div class="video-wrapper" id="videoWrapper">
            <video id="videoPlayer" autoplay playsinline></video>
            
            <!-- Loading Indicator -->
            <div class="loading-indicator" id="loadingIndicator"></div>
            
            <!-- Controls Overlay -->
            <div class="controls-overlay" id="controlsOverlay">
                <!-- Top Controls -->
                <div class="controls-top">
                    <a href="../index.html" class="back-btn">
                        <span class="material-icons" style="font-size: 16px;">arrow_back</span>
                        Back
                    </a>
                </div>
                
                <!-- Center Controls -->
                <div class="controls-center">
                    <button class="ctrl-btn" id="prevBtn" onclick="prevEpisode()" title="Previous">
                        <span class="material-icons">skip_previous</span>
                    </button>
                    <button class="skip-btn" onclick="skipBackward()" title="Back 10s">
                        <span class="material-icons">replay_10</span>
                    </button>
                    <button class="play-pause-btn" id="playPauseBtn" onclick="togglePlayPause()">
                        <span class="material-icons" id="playIcon">play_arrow</span>
                    </button>
                    <button class="skip-btn" onclick="skipForward()" title="Forward 10s">
                        <span class="material-icons">forward_10</span>
                    </button>
                    <button class="ctrl-btn" id="nextBtn" onclick="nextEpisode()" title="Next">
                        <span class="material-icons">skip_next</span>
                    </button>
                </div>
                
                <!-- Bottom Controls -->
                <div class="controls-bottom">
                    <div class="progress-container">
                        <button class="mini-ctrl-btn" id="pauseMiniBtn" onclick="togglePlayPause()">
                            <span class="material-icons" id="miniPlayIcon">pause</span>
                        </button>
                        <div class="progress-bar" id="progressBar" onclick="seekVideo(event)">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
                        <button class="mini-ctrl-btn" onclick="toggleFullscreen()">
                            <span class="material-icons">fullscreen</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Title of current playing video -->
        <div class="title-section">
            <h2 id="episodeTitle">Loading...</h2>
        </div>

        <!-- Related Episodes -->
        <div class="related-section">
            <div class="section-title">Up Next</div>
            <div class="video-list" id="relatedList"></div>
        </div>
    </div>

    <script>
        const TOTAL_EPISODES = 32;
        const BASE_URL = 'https://pub-07d8d60145fc4fe28f34d4c6bd4a5549.r2.dev';
        const SKIP_SECONDS = 10;
        
        // Video durations (in seconds)
        const durations = {};
        for (let i = 1; i <= TOTAL_EPISODES; i++) {
            durations[i] = 24 * 60 + (i * 37) % 60;
        }

        // Get episode from URL
        const urlParams = new URLSearchParams(window.location.search);
        let currentEpisode = parseInt(urlParams.get('ep')) || 1;
        
        // Clamp episode
        currentEpisode = Math.max(1, Math.min(TOTAL_EPISODES, currentEpisode));

        const videoPlayer = document.getElementById('videoPlayer');
        const videoWrapper = document.getElementById('videoWrapper');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const miniPlayIcon = document.getElementById('miniPlayIcon');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const episodeTitle = document.getElementById('episodeTitle');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const timeDisplay = document.getElementById('timeDisplay');
        const relatedList = document.getElementById('relatedList');

        // Format duration
        function formatDuration(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            if (hours > 0) {
                return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }

        // Create video card for related
        function createVideoCard(episode) {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.onclick = () => loadEpisode(episode);
            
            card.innerHTML = `
                <div class="video-thumb">
                    <img src="thumbnails/episode-${episode}.jpg" alt="Episode ${episode}" loading="lazy">
                    <div class="duration-badge">${formatDuration(durations[episode])}</div>
                </div>
                <div class="video-info">
                    <div class="video-title">Good Boy Hindi Episode ${episode}</div>
                </div>
            `;
            
            return card;
        }

        // Load episode
        function loadEpisode(ep) {
            currentEpisode = ep;
            
            // Show loading
            loadingIndicator.style.display = 'block';
            
            // Set video source
            videoPlayer.src = `${BASE_URL}/episode-${ep}.mp4`;
            
            // Update URL without reload
            window.history.pushState({}, '', `player/index.html?ep=${ep}`);
            
            // Save to localStorage
            localStorage.setItem('lastWatchedEpisode', ep);
            
            // Update title
            episodeTitle.textContent = `Good Boy Hindi Episode ${ep}`;
            
            // Update navigation buttons
            prevBtn.disabled = ep <= 1;
            nextBtn.disabled = ep >= TOTAL_EPISODES;
            
            // Load related episodes
            loadRelatedEpisodes(ep);
            
            // Play video
            videoPlayer.play().catch(e => console.log('Autoplay blocked:', e));
            
            // Hide loading when video starts
            videoPlayer.onloadeddata = () => {
                loadingIndicator.style.display = 'none';
            };
            
            // Reset progress
            progressFill.style.width = '0%';
            timeDisplay.textContent = '0:00 / 0:00';
        }

        // Load related episodes (next 5 + previous if needed)
        function loadRelatedEpisodes(ep) {
            relatedList.innerHTML = '';
            
            // Show next 5 episodes first
            const episodesToShow = [];
            for (let i = ep + 1; i <= Math.min(ep + 5, TOTAL_EPISODES); i++) {
                episodesToShow.push(i);
            }
            
            // If we have less than 5 next, fill with previous
            if (episodesToShow.length < 5) {
                for (let i = ep - 1; i >= Math.max(1, ep - (5 - episodesToShow.length)); i--) {
                    episodesToShow.unshift(i);
                }
            }
            
            // Add cards
            episodesToShow.forEach(epi => {
                const card = createVideoCard(epi);
                relatedList.appendChild(card);
            });
            
            // If no related episodes
            if (relatedList.children.length === 0) {
                relatedList.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">Series Complete! 🎉</div>';
            }
        }

        // Navigation functions
        function nextEpisode() {
            if (currentEpisode < TOTAL_EPISODES) {
                loadEpisode(currentEpisode + 1);
            }
        }

        function prevEpisode() {
            if (currentEpisode > 1) {
                loadEpisode(currentEpisode - 1);
            }
        }

        // Skip forward/backward
        function skipForward() {
            if (videoPlayer.duration) {
                videoPlayer.currentTime = Math.min(videoPlayer.currentTime + SKIP_SECONDS, videoPlayer.duration);
            }
        }

        function skipBackward() {
            videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - SKIP_SECONDS);
        }

        // Play/Pause toggle
        function togglePlayPause() {
            if (videoPlayer.paused) {
                videoPlayer.play();
                playIcon.textContent = 'pause';
                miniPlayIcon.textContent = 'pause';
            } else {
                videoPlayer.pause();
                playIcon.textContent = 'play_arrow';
                miniPlayIcon.textContent = 'play_arrow';
            }
        }

        // Update play/pause icon on play/pause events
        videoPlayer.addEventListener('play', () => {
            playIcon.textContent = 'pause';
            miniPlayIcon.textContent = 'pause';
        });

        videoPlayer.addEventListener('pause', () => {
            playIcon.textContent = 'play_arrow';
            miniPlayIcon.textContent = 'play_arrow';
        });

        // Toggle controls on click
        videoWrapper.addEventListener('click', (e) => {
            // Don't toggle if clicking on controls
            if (e.target.closest('.controls-overlay') && e.target !== videoWrapper) {
                return;
            }
            
            videoWrapper.classList.toggle('controls-visible');
            
            // Auto-hide after 4 seconds if visible
            if (videoWrapper.classList.contains('controls-visible')) {
                clearTimeout(controlsTimeout);
                controlsTimeout = setTimeout(() => {
                    videoWrapper.classList.remove('controls-visible');
                }, 4000);
            }
        });

        // Prevent controls clicks from toggling wrapper
        document.querySelector('.controls-overlay').addEventListener('click', (e) => {
            e.stopPropagation();
        });

        let controlsTimeout;

        // Fullscreen toggle
        function toggleFullscreen() {
            const wrapper = videoWrapper;
            
            if (!document.fullscreenElement) {
                wrapper.requestFullscreen().catch(err => {
                    console.log('Fullscreen error:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Progress bar updates
        videoPlayer.addEventListener('timeupdate', () => {
            if (videoPlayer.duration) {
                const progress = (videoPlayer.currentTime / videoPlayer.duration) * 100;
                progressFill.style.width = `${progress}%`;
                timeDisplay.textContent = `${formatDuration(Math.floor(videoPlayer.currentTime))} / ${formatDuration(Math.floor(videoPlayer.duration))}`;
            }
        });

        // Seek functionality
        function seekVideo(event) {
            const rect = progressBar.getBoundingClientRect();
            const pos = (event.clientX - rect.left) / rect.width;
            videoPlayer.currentTime = pos * videoPlayer.duration;
        }

        // Autoplay next episode
        videoPlayer.addEventListener('ended', () => {
            if (currentEpisode < TOTAL_EPISODES) {
                setTimeout(() => {
                    loadEpisode(currentEpisode + 1);
                }, 1000);
            } else {
                alert('Series Complete! 🎉');
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target === videoPlayer) return;
            
            switch(e.key) {
                case 'ArrowRight':
                    nextEpisode();
                    break;
                case 'ArrowLeft':
                    prevEpisode();
                    break;
                case 'f':
                case 'F':
                    toggleFullscreen();
                    break;
                case ' ':
                    if (videoPlayer.paused) {
                        videoPlayer.play();
                    } else {
                        videoPlayer.pause();
                    }
                    e.preventDefault();
                    break;
            }
        });

        // Handle fullscreen change for styling
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                videoWrapper.style.aspectRatio = 'auto';
                videoWrapper.style.maxHeight = '100vh';
                videoWrapper.style.width = '100vw';
            } else {
                videoWrapper.style.aspectRatio = '16/9';
                videoWrapper.style.maxHeight = '75vh';
                videoWrapper.style.width = '100%';
            }
        });

        // Initial load
        loadEpisode(currentEpisode);
    </script>
</body>
</html>
