<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/good-boy/">
    <title>Player</title>
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #fff;
        }

        /* Player Container */
        .player-container {
            max-width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Video Wrapper - takes most of screen */
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            flex: 1;
            min-height: 70vh;
            max-height: 85vh;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }

        /* Custom Controls Overlay */
        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 40px 20px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .video-wrapper:hover .controls-overlay,
        .video-wrapper:focus-within .controls-overlay,
        .video-wrapper.controls-visible .controls-overlay {
            opacity: 1;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Control Buttons */
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-btn:hover {
            background: #ff2e63;
            transform: scale(1.1);
        }

        .ctrl-btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            transform: none;
            opacity: 0.5;
        }

        .ctrl-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Back Button */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
        }

        .video-wrapper:hover .back-btn,
        .video-wrapper.controls-visible .back-btn {
            opacity: 1;
        }

        .back-btn:hover {
            background: #ff2e63;
        }

        /* Loading indicator */
        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #ff2e63;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
            z-index: 5;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Related Episodes Below */
        .related-section {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: #ff2e63;
            border-radius: 4px;
        }

        /* Video List (1 column - same as home) */
        .video-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Video Card */
        .video-card {
            display: flex;
            background: transparent;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .video-card:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .video-card:hover .video-title {
            color: #ff6b6b;
        }

        .video-thumb {
            position: relative;
            width: 180px;
            aspect-ratio: 16/9;
            border-radius: 8px;
            overflow: hidden;
            background: #1a1a1a;
            flex-shrink: 0;
            margin: 10px;
        }

        .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .video-card:hover .video-thumb img {
            transform: scale(1.05);
        }

        .duration-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .video-info {
            padding: 10px 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .video-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.3s ease;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .video-wrapper {
                min-height: 60vh;
                max-height: 70vh;
            }

            .related-section {
                padding: 15px;
            }

            .video-thumb {
                width: 140px;
                margin: 8px;
            }

            .video-title {
                font-size: 0.85rem;
            }

            .ctrl-btn {
                width: 35px;
                height: 35px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .video-thumb {
                width: 120px;
                margin: 6px;
            }

            .video-title {
                font-size: 0.8rem;
                -webkit-line-clamp: 2;
            }

            .back-btn {
                padding: 8px 12px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <!-- Video Wrapper -->
        <div class="video-wrapper" id="videoWrapper">
            <video id="videoPlayer" autoplay playsinline></video>
            
            <!-- Loading Indicator -->
            <div class="loading-indicator" id="loadingIndicator"></div>
            
            <!-- Back Button -->
            <a href="../index.html" class="back-btn">← Back</a>
            
            <!-- Custom Controls Overlay -->
            <div class="controls-overlay" id="controlsOverlay">
                <div class="controls-group">
                    <button class="ctrl-btn" id="prevBtn" onclick="prevEpisode()" title="Previous">
                        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="ctrl-btn" id="playPauseBtn" onclick="togglePlayPause()" title="Play/Pause">
                        <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
                        <svg viewBox="0 0 24 24" id="pauseIcon" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="ctrl-btn" id="nextBtn" onclick="nextEpisode()" title="Next">
                        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>
                
                <div class="controls-group">
                    <button class="ctrl-btn" onclick="toggleFullscreen()" title="Fullscreen">
                        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Related Episodes -->
        <div class="related-section">
            <div class="section-title">Up Next</div>
            <div class="video-list" id="relatedList"></div>
        </div>
    </div>

    <script>
        const TOTAL_EPISODES = 32;
        const BASE_URL = 'https://pub-07d8d60145fc4fe28f34d4c6bd4a5549.r2.dev';
        
        // Video durations (in seconds)
        const durations = {};
        for (let i = 1; i <= TOTAL_EPISODES; i++) {
            durations[i] = 24 * 60 + (i * 37) % 60;
        }

        // Get episode from URL
        const urlParams = new URLSearchParams(window.location.search);
        let currentEpisode = parseInt(urlParams.get('ep')) || 1;
        
        // Clamp episode
        currentEpisode = Math.max(1, Math.min(TOTAL_EPISODES, currentEpisode));

        const videoPlayer = document.getElementById('videoPlayer');
        const videoWrapper = document.getElementById('videoWrapper');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const relatedList = document.getElementById('relatedList');

        // Format duration
        function formatDuration(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            if (hours > 0) {
                return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }

        // Create video card for related
        function createVideoCard(episode) {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.onclick = () => loadEpisode(episode);
            
            card.innerHTML = `
                <div class="video-thumb">
                    <img src="thumbnails/episode-${episode}.jpg" alt="Episode ${episode}" loading="lazy">
                    <div class="duration-badge">${formatDuration(durations[episode])}</div>
                </div>
                <div class="video-info">
                    <div class="video-title">Good Boy Hindi Episode ${episode}</div>
                </div>
            `;
            
            return card;
        }

        // Load episode
        function loadEpisode(ep) {
            currentEpisode = ep;
            
            // Show loading
            loadingIndicator.style.display = 'block';
            
            // Set video source
            videoPlayer.src = `${BASE_URL}/episode-${ep}.mp4`;
            
            // Update URL without reload
            window.history.pushState({}, '', `player/index.html?ep=${ep}`);
            
            // Save to localStorage
            localStorage.setItem('lastWatchedEpisode', ep);
            
            // Update navigation buttons
            prevBtn.disabled = ep <= 1;
            nextBtn.disabled = ep >= TOTAL_EPISODES;
            
            // Load related episodes
            loadRelatedEpisodes(ep);
            
            // Play video
            videoPlayer.play().catch(e => console.log('Autoplay blocked:', e));
            
            // Hide loading when video starts
            videoPlayer.onloadeddata = () => {
                loadingIndicator.style.display = 'none';
            };
        }

        // Load related episodes (next 5 + previous 3)
        function loadRelatedEpisodes(ep) {
            relatedList.innerHTML = '';
            
            // Show next 5 episodes first
            const nextEpisodes = [];
            for (let i = ep + 1; i <= Math.min(ep + 5, TOTAL_EPISODES); i++) {
                nextEpisodes.push(i);
            }
            
            // If we have less than 5 next, fill with previous
            const previousEpisodes = [];
            if (nextEpisodes.length < 5) {
                for (let i = ep - 1; i >= Math.max(1, ep - (5 - nextEpisodes.length)); i--) {
                    previousEpisodes.push(i);
                }
            }
            
            // Add previous episodes before next (if showing all)
            [...previousEpisodes.reverse(), ...nextEpisodes].forEach(epi => {
                const card = createVideoCard(epi);
                relatedList.appendChild(card);
            });
            
            // If no related episodes
            if (relatedList.children.length === 0) {
                relatedList.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">Series Complete! 🎉</div>';
            }
        }

        // Navigation functions
        function nextEpisode() {
            if (currentEpisode < TOTAL_EPISODES) {
                loadEpisode(currentEpisode + 1);
            }
        }

        function prevEpisode() {
            if (currentEpisode > 1) {
                loadEpisode(currentEpisode - 1);
            }
        }

        // Play/Pause toggle
        function togglePlayPause() {
            if (videoPlayer.paused) {
                videoPlayer.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                videoPlayer.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        }

        // Update play/pause icon on play/pause events
        videoPlayer.addEventListener('play', () => {
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
        });

        videoPlayer.addEventListener('pause', () => {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
        });

        // Fullscreen toggle
        function toggleFullscreen() {
            const wrapper = videoWrapper;
            
            if (!document.fullscreenElement) {
                wrapper.requestFullscreen().catch(err => {
                    console.log('Fullscreen error:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Show controls on click
        videoWrapper.addEventListener('click', (e) => {
            if (e.target === videoPlayer || e.target === videoWrapper) {
                videoWrapper.classList.toggle('controls-visible');
                setTimeout(() => {
                    videoWrapper.classList.remove('controls-visible');
                }, 3000);
            }
        });

        // Hide controls after 3 seconds of no interaction
        let controlsTimeout;
        videoWrapper.addEventListener('mousemove', () => {
            videoWrapper.classList.add('controls-visible');
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                videoWrapper.classList.remove('controls-visible');
            }, 3000);
        });

        // Autoplay next episode
        videoPlayer.addEventListener('ended', () => {
            if (currentEpisode < TOTAL_EPISODES) {
                setTimeout(() => {
                    loadEpisode(currentEpisode + 1);
                }, 1000);
            } else {
                alert('Series Complete! 🎉');
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target === videoPlayer) return;
            
            switch(e.key) {
                case 'ArrowRight':
                    nextEpisode();
                    break;
                case 'ArrowLeft':
                    prevEpisode();
                    break;
                case 'f':
                case 'F':
                    toggleFullscreen();
                    break;
                case ' ':
                    if (videoPlayer.paused) {
                        videoPlayer.play();
                    } else {
                        videoPlayer.pause();
                    }
                    e.preventDefault();
                    break;
            }
        });

        // Handle fullscreen change for styling
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                videoWrapper.style.maxHeight = '100vh';
                videoWrapper.style.minHeight = '100vh';
            } else {
                videoWrapper.style.maxHeight = '85vh';
                videoWrapper.style.minHeight = '70vh';
            }
        });

        // Initial load
        loadEpisode(currentEpisode);
    </script>
</body>
</html>
